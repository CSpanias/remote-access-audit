# Context fields collected before an assessment begins.
#
# These fields define the information required to describe
# the client's VPN environment, including the VPN solution,
# deployment model, authentication methods and user population.
#
# Fields are loaded dynamically by the application to allow
# future expansion without code changes.

- id: client_name
  order: 1
  label: Client / Organisation Name
  type: string
  required: true

- id: vpn_vendor
  order: 2
  label: Which VPN solution is being reviewed?
  type: choice
  required: true

  options:
    - Cisco Secure Client
    - Palo Alto GlobalProtect
    - Fortinet FortiClient
    - Check Point Remote Access VPN
    - Microsoft Always On VPN
    - OpenVPN
    - WireGuard
    - Other

- id: vpn_version
  order: 3
  label: Which VPN Platform Version / Service Release is in use?
  type: string
  required: true

- id: deployment_model
  order: 4
  label: Which deployment model is used?
  type: choice
  required: true

  options:
    - Cloud Hosted
    - On-Premises
    - Hybrid

- id: vpn_user_count
  order: 5
  label: Total VPN Users
  type: integer
  required: true

- id: vpn_gateway_count
  order: 6
  label: Number of VPN Gateways
  type: integer
  required: false

- id: authentication_method
  order: 7
  label: Primary VPN Authentication Method
  type: choice
  required: true

  options:
    - Machine Certificate
    - User Certificate
    - EAP-TLS
    - Username and Password
    - Username and Password with MFA
    - Other

- id: identity_provider
  order: 8
  label: Identity Provider / Authentication Source
  type: choice
  required: false

  options:
    - Microsoft Entra ID
    - Active Directory
    - LDAP
    - RADIUS
    - Local Accounts
    - Other

- id: tunnel_type
  order: 9
  label: Which VPN tunnel type is deployed?
  type: choice
  required: false

  options:
    - Device Tunnel
    - User Tunnel
    - Device and User Tunnel

- id: certificate_authority
  order: 10
  label: Certificate Authority Used for VPN Authentication
  type: choice
  required: false

  options:
    - Active Directory Certificate Services (AD CS)
    - Intune PKCS
    - Intune SCEP
    - Third-Party CA
    - Other

- id: user_control
  order: 11
  label: What level of VPN user control is permitted?
  type: choice
  required: false

  options:
    - No User Control
    - Disconnect Only
    - Full Control

- id: split_tunnel_mode
  order: 12
  label: How is VPN traffic routed?
  type: choice
  required: false

  options:
    - Full Tunnel
    - Split Tunnel
    - Split-by-Exception

- id: mfa_solution
  order: 13
  label: MFA Provider
  type: choice
  required: false

  options:
    - Microsoft Entra MFA
    - Microsoft Authenticator
    - Duo Security
    - RSA SecureID
    - Okta Verify
    - PingID
    - Cisco Duo
    - Other
    - Not Applicable