- finding_id: pra-vault-password-rotation-not-enforced
  finding_title: Privileged Credential Rotation Not Enforced
  theme: Administrative Security

  question: Are privileged credentials rotated automatically?

  expected_answer: compliant

  expected_value: >
    Privileged credentials are rotated automatically on a
    scheduled basis and/or following checkout where
    supported.

  solution_types:
    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: >
      Review credential lifecycle management processes and
      determine whether privileged credentials are rotated
      automatically.

    BeyondTrust PRA: >
      /login > Vault > Account Policies.

      Review password rotation schedules, rotation after
      checkout settings, and Vault account governance
      controls.

  description: >
    Privileged credentials were not automatically rotated,
    increasing the risk associated with credential
    disclosure, reuse, and long-term compromise.

  commentary: >
    Automatic password rotation limits the usefulness of
    compromised credentials and reduces the likelihood of
    unauthorised access through reused or previously exposed
    passwords.

  solution: >
    Implement automated credential rotation through Vault
    Account Policies and ensure credentials are changed
    regularly and following checkout where appropriate.

  positive: >
    Privileged credentials were rotated automatically using
    defined Vault governance controls.

- finding_id: pra-credential-association-not-restricted
  finding_title: Credential Association Restrictions Not Enforced
  theme: Administrative Security

  question: Are Vault credentials restricted to authorised Assets and Asset Groups?

  expected_answer: compliant

  expected_value: >
    Vault credentials are associated only with authorised
    Assets and Asset Groups and are not broadly available
    across the environment.

  solution_types:
    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: >
      Determine whether privileged credentials are restricted
      to the systems on which they are intended to be used.

    BeyondTrust PRA: >
      /login > Vault > Accounts.

      Review Asset Association settings and determine whether
      credentials are limited to approved Assets and Asset
      Groups.

  description: >
    Privileged credentials were not appropriately restricted
    through Asset Association controls and could be used
    across a broader range of systems than necessary.

  commentary: >
    Broad credential availability increases the risk of
    inappropriate credential use and may allow privileged
    accounts to be used on systems for which they were not
    intended. Asset Association helps enforce least-privilege
    principles by limiting where credentials may be injected.

  solution: >
    Configure Asset Association controls to ensure
    credentials are available only for approved Assets and
    Asset Groups that require them.

  positive: >
    Vault credentials were restricted to authorised Assets and Asset Groups 
    through Asset Association controls.