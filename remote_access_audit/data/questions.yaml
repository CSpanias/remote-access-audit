  theme: Cryptography

  question: Are legacy VPN protocols such as PPTP disabled?

  expected_answer: compliant

  expected_value: |
    Legacy VPN protocols such as PPTP are disabled.

  solution_types:
    - vpn

  vendors:
    - all

  hints:
    common: |
      Review the VPN protocols supported by the platform and verify that 
      deprecated protocols such as PPTP are disabled and cannot be used by 
      clients.

  description: >
    Legacy VPN protocols were permitted despite known security weaknesses.

  commentary: >
    Protocols such as PPTP are no longer considered suitable for protecting 
    sensitive organisational communications.

  positive: >
    Legacy VPN protocols have been disabled.

  solution: >
    Remove support for deprecated VPN protocols and permit only modern,
    security-approved alternatives.
  
  references:

    generic: []

    vendors: 

      Microsoft Always On VPN: [
        https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/,
      ]

- finding_id: weak-tls-configuration
  finding_title: Weak TLS Configuration
  theme: Cryptography

  question: Are only TLS 1.2 and TLS 1.3 permitted for remote access 
    communications?

  expected_answer: compliant

  expected_value: |
    TLS 1.0 and TLS 1.1 are disabled. Only TLS 1.2 and TLS 1.3 are permitted.

  solution_types:
    - vpn

  vendors:
    - all

  hints:
    common: |
      Review TLS configuration and confirm that only supported TLS versions are 
      permitted for VPN communications.

    Microsoft Always On VPN: |
      RRAS Server, SCHANNEL TLS Configuration, NPS and Windows Security Settings

  description: >
    Deprecated TLS versions were permitted for remote access communications.

  commentary: >
    Deprecated TLS versions contain known weaknesses and may expose remote 
    access communications to downgrade and cryptographic attacks.

  positive: >
    Remote access communications were restricted to supported TLS versions.


  solution: >
    Enforce the use of TLS 1.2 and TLS 1.3 for remote access communications by 
    removing support for older protocol versions.

  references:

    generic: []

    vendors: 

      Microsoft Always On VPN: [
        https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/,
      ]

- finding_id: weak-cryptography
  finding_title: Weak Cryptographic Algorithms Permitted
  theme: Cryptography

  question: Are deprecated ciphers and cryptographic algorithms disabled?

  expected_answer: compliant

  expected_value: >
    Deprecated cryptographic algorithms and weak cipher suites are disabled.

  solution_types:
    - vpn
    - pra

  vendors:
    - all

  hints:
