- finding_id: user-access-not-reviewed
  finding_title: User Access Not Periodically Reviewed
  theme: Access Control

  question: Are remote access permissions reviewed on a regular basis?

  expected_answer: compliant

  expected_value: |
    Remote access permissions are reviewed periodically and evidence of reviews 
    is retained.

  solution_types:
    - vpn
    - pra

  vendors:
    - all

  hints:
    common: |
      Ask how remote access permissions are reviewed, who performs the review, 
      how often it occurs, and whether evidence of recent reviews can be 
      provided. Where formal reviews are not performed, determine whether 
      compensating controls such as account expiry, identity governance 
      processes, automated lifecycle management, or access recertification 
      mechanisms are in place.

    Microsoft Always On VPN: |
      Active Directory or Entra ID VPN access groups, access review records, 
      and entitlement reviews.

  description: >
    Remote access permissions were not subject to periodic review.

  commentary: >
    Access reviews help ensure that users retain only the access required for 
    their current job responsibilities. Regular reviews reduce the risk of 
    excessive access, orphaned accounts, and inappropriate access permissions 
    remaining assigned following role changes.

  positive: >
    Remote access permissions were reviewed regularly.

  solution: >
    Establish a formal access review process to validate ongoing business need 
    and remove unnecessary permissions.

  references:

    generic: []

    vendors: 

      Microsoft Always On VPN: [
        https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/,
      ]

- finding_id: pra-jump-clients-not-restricted
  finding_title: Jump Client Deployment Not Restricted
  theme: Access Control

  question: |
    Are Jump Clients deployed only to approved and appropriately governed 
    systems?

  expected_answer: compliant

  solution_types:
    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: |
      Review deployed Jump Clients, associated Asset Groups, automatic upgrade 
      settings, stale client cleanup settings, and deployment governance 
      controls.

    BeyondTrust PRA: |
      /login > Asset Management > Jump Clients

  expected_value: |
    Jump Clients are deployed only to approved systems, assigned to appropriate 
    Asset Groups, and reviewed periodically.

  description: >
    Jump Clients were deployed without appropriate governance or restrictions.

  commentary: >
    Jump Clients provide persistent unattended remote access to managed systems.
    Uncontrolled deployment may introduce long-lived remote access paths into
    sensitive systems and environments, increasing the risk of excessive access,
    orphaned remote access agents, and unauthorised connectivity. Restricting
    deployments to approved systems and periodically reviewing existing Jump
    Clients helps maintain visibility and supports least-privilege access
    principles.

  positive: >
    Jump Client deployment was appropriately controlled.

  solution: >
    Restrict Jump Client deployment to approved systems and review deployments 
    periodically.

  references:

    generic: []

    vendors:

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/jump-clients-1,
      ]

- finding_id: pra-vendor-account-expiration-not-enforced
  finding_title: Vendor Account Expiration Not Enforced
  theme: Access Control

  question: |
    Are vendor accounts subject to automatic expiration controls?

  expected_answer: compliant

  solution_types:
    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: |
      Review how vendor accounts are managed and determine whether account 
      lifecycle controls automatically expire access when it is no longer 
      required.

    BeyondTrust PRA: |
      /login > Users & Security > Vendors

  expected_value: |
    Review Vendor Group settings and determine whether:
      - Vendor users expire after a defined period
      - Expired users are automatically deleted
      - Vendor access requires periodic renewal

  description: >
    Vendor accounts were not subject to automatic expiration controls.

  commentary: >
    Vendor accounts frequently provide third-party access to internal systems 
    and services. Failure to expire accounts automatically may result in 
    unnecessary or orphaned access remaining available after business 
    requirements have ended.

  positive: >
    Vendor accounts were subject to defined expiration and lifecycle management 
    controls.

  solution: >
    Configure vendor account expiration settings and automatic cleanup controls 
    to ensure third-party access is removed when no longer required.

  references:

    generic: []

    vendors:

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/pf-vendors,
      ]

- finding_id: pra-network-restrictions-not-configured
  finding_title: Network Restrictions Not Configured
  theme: Access Control

  question: |
    Are administrative and remote access interfaces restricted to approved 
    source networks?

  expected_answer: compliant

  solution_types:
    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: |
      Review whether access to administrative interfaces and remote access 
      consoles is restricted based on source network location.

    BeyondTrust PRA: |
      /login > Management > Security > Network Restrictions

      Review restrictions configured for:
      - Admin Interface (/login)
      - API Interface (/api)
      - Desktop Access Console
      - Mobile Access Console
      - Web Console (/console)

  expected_value: |
    Administrative interfaces, APIs, and remote access consoles are restricted 
    to approved source networks where operationally feasible.

  description: >
    Administrative and remote access interfaces were accessible from
    unrestricted source networks.

  commentary: >
    Network restrictions provide an additional layer of defence by limiting
    administrative and remote access interfaces to approved source networks.
    While not required in all environments, organisations with defined
    management networks, privileged access workstations, VPN gateways, or
    other trusted administration locations may benefit from restricting
    access to authorised network ranges.

  positive: >
    Administrative and remote access interfaces were restricted to approved
    source networks.

  solution: >
    Where operationally appropriate, configure network restrictions to limit
    access to administrative interfaces and remote access consoles from
    approved source networks.

  references:

    generic: []

    vendors:

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/pf-security#network-restrictions,
      ]

- finding_id: users-can-modify-vpn-configuration
  finding_title: Users Able to Modify VPN Security Settings
  theme: Access Control

  question: Are users prevented from modifying security-critical VPN 
    configuration settings?

  expected_answer: compliant

  expected_value: |
    Security-critical VPN settings are centrally managed and cannot be modified 
    by standard users.

  solution_types:
    - vpn

  vendors:
    - all

  hints:
    common: |
      Review the VPN client configuration and determine whether end users can 
      modify security-relevant settings such as authentication methods, 
      connection profiles, routing behaviour, or always-on functionality.

    Microsoft Always On VPN: |
      Review the deployed VPN profile configuration and verify whether users 
      are permitted to modify, disable, or remove the VPN profile. Confirm 
      whether Always On behaviour can be disabled by end users.

  description: >
    End users were able to modify security-relevant VPN configuration settings. 
    Unrestricted modification of VPN settings may allow users to weaken 
    security protections, bypass organisational controls, or establish 
    connections that do not comply with corporate security requirements.

  commentary: >
    The assessment identified that end users were permitted to alter 
    security-critical VPN settings. Depending on the configuration, users may 
    be able to disable Always On functionality, modify authentication 
    parameters, alter traffic routing behaviour, or otherwise weaken the 
    security posture of the remote access solution. Restricting modification of 
    security-relevant settings helps ensure that organisational security 
    requirements are applied consistently across all remote access users.

  positive: >
      Security-critical VPN settings were centrally managed and could not be 
      modified by standard users.

  solution: >
    Centrally manage VPN configuration settings and prevent end users from 
    modifying security-critical parameters that could weaken organisational 
    security controls.

  references:

    generic: []

    vendors: 

      Microsoft Always On VPN: [
        https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/,
      ]

