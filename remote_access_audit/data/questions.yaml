    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: >
      Review the systems on which Jump Clients are deployed and confirm
      deployment is restricted to approved devices and supported business
      requirements.

    BeyondTrust PRA: >
      /login > Asset Management > Jump Clients.

      Review Jump Client deployments, associated Asset Groups,
      assigned Asset Policies, and evidence of periodic review.

  description: >
    Jump Clients were deployed without appropriate governance
    or restrictions.

  commentary: >
    Uncontrolled Jump Client deployment may introduce unintended
