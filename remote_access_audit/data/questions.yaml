    and integrity of remote access communications and increase the risk of 
    cryptographic attacks.

  positive: >
    Strong, modern cryptographic algorithms were enforced.

  solution: >
    Align the cryptographic configuration with current vendor guidance and 
    industry best practice.

  references:

    generic: []

    vendors: 

      Microsoft Always On VPN: [
        https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/,
      ]

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/pf-tls-configuration,
      ]

#-------------------------------------------------------------------------------
# ACCESS CONTROL
#-------------------------------------------------------------------------------

- finding_id: vpn-unrestricted-split-tunnelling
  finding_title: Unrestricted Split Tunnelling
  theme: Access Control

  question: Is split tunnelling disabled or appropriately restricted?

  expected_answer: compliant

  expected_value: |
    Split tunnelling is disabled or restricted to approved routes and 
    destinations.

  solution_types:
    - vpn

  vendors:
    - all

  hints:
    common: |
      Review VPN routing behaviour and determine whether split tunnelling is 
      disabled or governed through documented restrictions, approved routes, 
      and security controls.

  description: >
    Split tunnelling was enabled without appropriate controls.

  commentary: >
    Split tunnelling may expose managed devices to untrusted networks while 
    simultaneously connected to internal resources.

  positive: >
    Split tunnelling was disabled or appropriately controlled.

  solution: >
    Minimise the use of split tunnelling and, where it remains necessary, 
    implement appropriate restrictions, monitoring, and governance controls.

  references:

    generic: []

    vendors: 

      Microsoft Always On VPN: [
        https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/,
      ]

- finding_id: aovpn-route-validation-not-enforced
  finding_title: Route Validation Controls Not Enforced
  theme: Access Control

  question: Are VPN routes restricted to approved destinations and networks?

  expected_answer: compliant

  expected_value: |
    VPN routes are restricted to approved networks and destinations only.

  solution_types:
    - vpn

  vendors:
    - Microsoft Always On VPN

  hints:
    common: |
      Review which networks and resources are accessible through the VPN. 
      Confirm only approved routes and destinations are available and that 
      unnecessary internal networks are not exposed to remote devices.

    Microsoft Always On VPN: |
      VPN Profile XML > Routes, RRAS configuration, route validation controls 
      and exclusions

  description: >
    Route restrictions and validation controls were not enforced for VPN 
    traffic.

  commentary: >
    Route validation helps ensure traffic is routed only through approved 
    network paths and reduces the risk of traffic bypassing organisational 
    security controls.

  positive: >
    Route validation controls were implemented and enforced.

  solution: >
    Validate configured VPN routes and enforce route validation controls to 
    limit connectivity to approved destinations.

  references:

    generic: []

    vendors: 

      Microsoft Always On VPN: [
        https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/,
      ]

- finding_id: device-compliance-not-enforced
