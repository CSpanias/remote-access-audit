# Assessment question definitions.
#
# This file contains all audit controls used during remote access reviews.
#
# Each question includes:
# - Vulnerability mapping
# - Compliance expectations
# - Remediation guidance
# - Positive observations
# - Vendor-specific navigation hints
#
# Questions should be maintained within this file rather
# than being hard-coded into the application.
#
# Response Options:
# 1. Compliant
# 2. Non-Compliant
# 3. Not Applicable
# 4. Unknown
#
# Questions should be phrased so that the secure configuration
# state always results in a "Compliant" response.

#-------------------------------------------------------------------------------
# PLATFORM CONFIGURATION
#-------------------------------------------------------------------------------

- finding_id: pra-update-management-not-defined
  finding_title: Appliance Update Process Not Defined
  theme: Platform Configuration

  question: |
    Are appliance updates managed through a defined update process?

  expected_answer: compliant

  solution_types:
    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: |
      Review how appliance updates are managed and determine whether updates 
      are installed through a defined and documented process.

    BeyondTrust PRA: |
      /appliance > Updates

  expected_value: |
    Appliance updates are managed through a defined maintenance and update 
    process.

  description: >
    Appliance updates were not managed through a defined update process.

  commentary: >
    Regular software maintenance helps ensure vulnerabilities, bug fixes, and 
    security improvements are applied in a timely manner. A defined update 
    process helps maintain platform security, stability, and vendor 
    supportability.

  positive: >
    Appliance updates were managed through a defined update process.

  solution: >
    Establish and maintain a documented update process for the BeyondTrust 
    appliance, including update monitoring, maintenance windows, testing, 
    approval, and deployment activities.

  references:

    generic: [
      https://docs.beyondtrust.com/pra/docs/welcome-to-privileged-remote-access,
    ]

    vendors: 

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/pf-updates,
      ]

- finding_id: aovpn-prelogon-connectivity-disabled
  finding_title: Pre-Logon VPN Connectivity Not Available
  theme: Platform Configuration

  question: Is Always On VPN connectivity enforced without requiring user 
    intervention?

  expected_answer: compliant

  expected_value: |
    Always On VPN connectivity is established automatically without user 
    intervention.

  solution_types:
    - vpn

  vendors:
    - Microsoft Always On VPN

  hints:
    common: |
      Determine whether VPN connectivity is established automatically without 
      requiring users to manually launch or connect the VPN. Confirm 
      connectivity is available whenever the device is outside trusted networks.

    Microsoft Always On VPN: |
      VPN Profile XML. Confirm AlwaysOn=true and Device Tunnel configuration 
      where applicable.

  description: >
    VPN connectivity was not available before user authentication.

  commentary: >
    Pre-logon VPN connectivity supports device management, Group Policy 
    processing, certificate enrollment, and other infrastructure services 
    before user sign-in. Environments relying on device tunnels may require 
    this capability.

  positive: >
    VPN connectivity was available prior to user logon.

  solution: >
    Consider enabling pre-logon connectivity where organisational requirements 
    rely on device management or machine-based services prior to user 
    authentication.

  references:

    generic: []

    vendors: 

      Microsoft Always On VPN: [
        https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/,
      ]

      BeyondTrust PRA: []

#-------------------------------------------------------------------------------
# AUTHENTICATION
#-------------------------------------------------------------------------------

- finding_id: user-mfa-not-enforced
  finding_title: Multi-Factor Authentication Not Enforced for Users
  theme: Authentication

  question: Is multi-factor authentication enforced for all remote access users?

  expected_answer: compliant

  solution_types:
    - vpn
    - pra

  vendors:
    - all

  hints:
    common: |
      Review the authentication configuration and determine whether all users 
      are required to complete multi-factor authentication before remote access 
      is granted.

    BeyondTrust PRA: |
      /login > Users & Security > Group Policies > Account Settings

      - Two Factor Authentication: Checked
      - Log in with an authenticator app: Required
      - Log in with TOTP ?
      - Log in with FIDO2 ?

    Microsoft Always On VPN: |
      NPS > Network Policies > Authentication Configuration

  expected_value: >
    MFA / 2FA configured

  description: >
    Multi-factor authentication was not enforced for remote access users,
    increasing the risk of account compromise through credential
    theft, password spraying, brute-force attacks, and credential
    reuse.

  commentary: >
    Remote access relied solely on single-factor authentication.
    Compromise of user credentials may allow an attacker to
    obtain privileged access to organisational systems and
    services. Multi-factor authentication provides an
    additional layer of protection by requiring users to
    present a second authentication factor beyond a password.

  positive: >
    Multi-factor authentication was enforced for all remote access users.

  solution: >
    Configure multi-factor authentication as a mandatory requirement for
    all remote access user accounts.

  references:

    generic: []

    vendors: 

      Microsoft Always On VPN: [
        https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/,
      ]

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/pf-group-policies#group-policy-settings,
      ]

- finding_id: admin-mfa-not-enforced
  finding_title: Administrator Multi-Factor Authentication Not Enforced
  theme: Authentication

  question: Are administrative and privileged accounts protected by 
    multi-factor authentication?

  expected_answer: compliant

  expected_value: |
    - Two Factor Authentication: Checked
    - Log in with an authenticator app: Required

  solution_types:
    - vpn
    - pra

  vendors:
    - all

  hints:
    common: |
      Review the authentication requirements applied to administrative, 
      privileged, break-glass, and platform management accounts. Verify that 
      MFA is enforced for all accounts capable of administering or managing the 
      remote access solution.

    BeyondTrust PRA: |
      /login > Users & Security > Group Policies > Account Settings

      Review Group Policies assigned to administrators and verify MFA 
      requirements such as TOTP or FIDO2 are enforced.
  
  description: >
    Multi-factor authentication was not enforced for administrative or 
    privileged accounts, increasing the risk of administrative account 
    compromise.

  commentary: >
    Administrative accounts provide highly privileged access to the remote 
    access platform. Compromise of such accounts may allow an attacker to 
    modify configurations, weaken security controls, access sensitive systems, 
    or establish persistent access. Multi-factor authentication helps reduce
    the risk of administrative account compromise.

  positive: >
    Multi-factor authentication was enforced for administrative and privileged 
    accounts.

  solution: >
    Configure multi-factor authentication as a mandatory control for all
    administrative and privileged accounts.

  references:

    generic: []

    vendors: 

      Microsoft Always On VPN: [
        https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/,
      ]

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/pf-group-policies#group-policy-settings,
      ]

- finding_id: aovpn-device-authentication-not-enforced
  finding_title: Device Authentication Not Enforced
  theme: Authentication

  question: |
    Is machine certificate authentication required for Device Tunnel 
    connections?

  expected_answer: compliant

  solution_types:
    - vpn

  vendors:
    - Microsoft Always On VPN

  hints:
    common: |
      Determine how Device Tunnel connections authenticate to the VPN service. 
      Confirm device identity is validated using machine certificates rather 
      than user credentials and verify only trusted, managed devices can 
      establish Device Tunnel connections.

    Microsoft Always On VPN: |
      NPS > Network Policies > Constraints > Authentication Methods, and RRAS > 
      Security > Authentication Provider
      
      Confirm Device Tunnel connections require machine certificate 
      authentication.

  expected_value: |
    Device Tunnel connections authenticate using machine certificates only.

  description: >
    Device Tunnel connections were not restricted to machine certificate 
    authentication.

  commentary: >
    Device Tunnel connectivity should rely on device identity rather than user 
    credentials. Failure to enforce device authentication may reduce assurance 
    that connecting systems are trusted and managed.

  positive: >
    Device Tunnel connectivity required machine certificates.


  solution: >
    Restrict Device Tunnel authentication to machine certificates to
    ensure connectivity is limited to trusted and managed devices.

  references:

    generic: []

    vendors: 

      Microsoft Always On VPN: [
        https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/,
      ]

- finding_id: pra-vendor-authentication-not-secure
  finding_title: Vendor Authentication Controls Not Sufficiently Configured
  theme: Authentication

  question: Are vendor authentication controls configured in accordance with 
    organisational security requirements?

  expected_answer: compliant

  solution_types:
    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: |
      Review the authentication controls applied to vendor accounts and
      determine whether appropriate security settings are configured.

    BeyondTrust PRA: |
      Management > Security > Vendor Authentication / Vendor Passwords

  expected_value: |
    Vendor Authentication:
    - Vendor Account Lockout After: configured
    - Vendor Account Lockout Duration: configured

    Vendor Passwords:
    - Minimum Password Length: configured
    - Complex Passwords: required
    - Password Expiration: configured
    - Default Authentication Method: ?
    - Default Password Expiration: ?

  description: >
    Vendor authentication controls were not configured in accordance with 
    organisational security requirements.

  commentary: >
    Vendor accounts often provide external users with privileged or sensitive 
    access to organisational systems. Weak authentication controls may increase 
    the risk of account compromise through password attacks, credential theft, 
    or unauthorised access. Appropriate authentication controls help ensure 
    that third-party access is governed and protected in line with 
    organisational security requirements.

  positive: >
    Vendor authentication controls were configured in accordance with 
    organisational security requirements.

  solution: >
    Review and strengthen vendor authentication controls. Ensure that 
    appropriate security settings such as MFA, password complexity, account 
    lockout protections, and secure account management controls are enforced 
    for all vendor accounts.

  references:

    generic: []

    vendors:

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/pf-security#vendor-authentication,
      ]

- finding_id: shared-accounts-permitted
  finding_title: Shared Accounts Permitted
  theme: Authentication
  
  question: Are individual user accounts required for remote access?

  expected_answer: compliant

  expected_value: |
    All remote access users are assigned unique individual accounts.

  solution_types:
    - vpn
    - pra

  vendors:
    - all

  hints:
    common: |
      Determine how users authenticate to the remote access platform and 
      whether uniquely assigned identities are used. Confirm that generic, 
      shared, or team accounts are not used for remote access activities.

    BeyondTrust PRA: |
      Review the user account inventory and authentication model. Determine 
      whether users authenticate using individually assigned accounts through 
      SSO, a directory service, or local platform accounts. Confirm that shared
      operational or administrative accounts are not used.

  description: >
    Shared accounts were permitted, reducing accountability and increasing the 
    difficulty of attributing activity to specific users.

  commentary: >
    The use of shared accounts limits auditability and may prevent accurate 
    attribution of actions performed through remote access connections.

  positive: >
    All remote access was performed using uniquely assigned accounts.

  solution: >
    Replace shared accounts with uniquely assigned user accounts to improve 
    accountability and auditability.

  references:

    generic: []

    vendors: 

      Microsoft Always On VPN: [
        https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/,
      ]

      BeyondTrust PRA: []

- finding_id: local-accounts-enabled
  finding_title: Local Accounts Enabled
  theme: Authentication

  question: Is remote access authentication integrated with a centrally managed 
    identity provider?

  expected_answer: compliant

  expected_value: >
    Authentication is integrated with a centrally managed identity provider and 
    locally managed platform accounts are restricted to approved administrative 
    or emergency access scenarios.

  solution_types:
    - vpn
    - pra

  vendors:
    - all

  hints:
    common: |
      Review the configured authentication source and determine whether users 
      authenticate through a centrally managed identity platform such as 
      Microsoft Entra ID, Active Directory, or an enterprise directory service. 
      Confirm that reliance on locally managed platform accounts is minimised 
      and restricted to approved administrative or break-glass use cases.

    BeyondTrust PRA: |
      Users & Security > Security Providers

      Review configured Security Providers and determine whether users 
      authenticate through centrally managed identity providers (e.g. SAML, 
      OIDC, LDAP, AD) instead of locally managed PRA accounts where appropriate.

  description: >
    Remote access authentication relied on locally managed accounts rather than 
    an enterprise identity provider.

  commentary: >
    The remote access platform relied primarily on locally
    managed accounts rather than a centrally managed identity
    provider. This may reduce visibility, governance,
    lifecycle management, access review capabilities, and the
    consistent enforcement of controls such as multi-factor
    authentication and conditional access policies.

  positive: >
    Remote access authentication was integrated with a central identity
    provider.

  solution: >
    Migrate remote access authentication to a centrally managed identity
    platform such as Entra ID, Active Directory, LDAP, or RADIUS.

  references:

    generic: []

    vendors: 

      Microsoft Always On VPN: [
        https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/,
      ]

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/pf-security-providers,
      ]

- finding_id: vpn-weak-authentication-methods
  finding_title: Weak Authentication Methods Allowed
  theme: Authentication

  question: Are only modern and secure authentication methods permitted?

  expected_answer: compliant

  expected_value: >
    Authentication relies on centrally managed identity services, MFA-enabled 
    authentication, and vendor-supported authentication protocols. Deprecated, 
    insecure, or password-only authentication methods are disabled.

  solution_types:
    - vpn

  vendors:
    - all

  hints:
    common: >
      Review configured authentication methods and confirm deprecated or 
      insecure authentication mechanisms are not permitted where the platform 
      supports stronger alternatives. Examples may include PAP, CHAP, 
      password-only authentication, or other legacy authentication methods.

  description: >
    Legacy authentication mechanisms were enabled, increasing exposure to 
    credential attacks and authentication bypass.

  commentary: >
    Legacy authentication mechanisms may be susceptible to password attacks, 
    credential interception, replay attacks, and other forms of authentication 
    abuse. Modern authentication methods provide stronger protection and
    typically support additional security controls such as multi-factor 
    authentication and centralised identity integration.

  positive: >
    Legacy authentication mechanisms were disabled.

  solution: >
    Retire legacy authentication mechanisms and standardise on modern,
    vendor-supported authentication methods.

  references:

    generic: []

    vendors: 

      Microsoft Always On VPN: [
        https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/,
      ]

#-------------------------------------------------------------------------------
# ADMINISTRATIVE SECURITY
#-------------------------------------------------------------------------------

- finding_id: pra-credential-injection-not-used
  finding_title: Credentials Disclosed to Users
  theme: Administrative Security

  question: Are credentials injected rather than disclosed to users?

  expected_answer: compliant

  solution_types:
    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: |
      Review how privileged users access managed systems. Determine whether 
      credentials are supplied automatically by the platform through credential 
      injection or whether users are able to view, copy, export, or manually 
      enter privileged credentials.

    BeyondTrust PRA: |
      Review Password Safe and session launch workflows. Verify whether users 
      establish privileged sessions using credential injection mechanisms or 
      whether passwords are disclosed to users before or during access.

  expected_value: |
    Privileged credentials are injected and are not disclosed to end users.

  description: >
    Privileged credentials were exposed to end users rather than being managed 
    through credential injection.

  commentary: >
    Credential injection reduces the risk of password disclosure, reuse, 
    unauthorised storage, and misuse by privileged users.

  positive: >
    Credential injection was used for privileged access.

  solution: >
    Where supported, use credential injection mechanisms to avoid exposing 
    privileged credentials to users.

  references:

    generic: []

    vendors:

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/desktop-credential-injection,
      ]

- finding_id: pra-file-transfer-malware-scanning-not-enabled
  finding_title: File Transfer Malware Scanning Not Enabled
  theme: Administrative Security

  question: Are transferred files subject to malware scanning before delivery?

  expected_answer: compliant

  solution_types:
    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: |
      Review whether an ICAP server is configured and whether file transfers 
      are inspected before delivery.

    BeyondTrust PRA: |
      /login > Management > Security > ICAP Configuration

  expected_value: |
    File transfers are inspected by an integrated malware scanning solution
    prior to delivery.

  description: >
    File transfers were not inspected for malicious content prior to delivery.

  commentary: >
    BeyondTrust PRA supports integration with external ICAP-compatible malware 
    scanning solutions for certain file transfers. While not a baseline 
    requirement for secure PRA operation, this capability may provide an
    additional layer of defence-in-depth for organisations with enhanced 
    monitoring, malware prevention, or regulatory requirements.

  positive: >
    File transfers were inspected using integrated malware scanning controls.

  solution: >
    Consider integrating PRA file transfers with an ICAP-compatible malware
    scanning platform where additional inspection and content filtering
    capabilities are required.

  references:

    generic: []

    vendors:

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/pf-security#icap-configuration,
      ]

- finding_id: pra-session-context-not-required
  finding_title: Session Context Not Required
  theme: Administrative Security

  question: |
    Are users required to provide a ticket reference or business justification 
    before initiating privileged sessions?

  expected_answer: compliant

  solution_types:
    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: |
      Determine whether users must provide operational context before accessing 
      privileged systems. Examples include ticket numbers, change references, 
      incident references, or free-text business justification.

    BeyondTrust PRA: |
      Asset Management > Asset Policies > Context Requirement

  expected_value: |
    Review the Context Requirement settings and determine whether users are 
    required to provide a ticket ID or business justification prior to starting 
    privileged sessions.

  description: >
    Privileged sessions could be initiated without requiring users to provide 
    business justification or a ticket reference.

  commentary: >
    Requiring a ticket reference or business justification increases 
    accountability and helps organisations demonstrate that privileged access 
    activities relate to legitimate business requirements. Session context also
    improves auditability and can assist with incident investigation and change 
    tracking.

  positive: >
    Privileged sessions required users to provide appropriate business context 
    before access was granted.

  solution: >
    Configure Asset Policies to require a ticket reference, business 
    justification, or equivalent access context before privileged sessions are 
    initiated.

  references:

    generic: []

    vendors: 

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/pf-jump-policies#context-requirement,
      ]

- finding_id: pra-vault-password-rotation-not-enforced
  finding_title: Privileged Credential Rotation Not Enforced
  theme: Administrative Security

  question: |
    Are privileged credentials rotated automatically?

  expected_answer: compliant

  solution_types:
    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: |
      Review account policies and confirm that password rotation is configured
      and enforced for privileged credentials. Review scheduled rotation
      settings, maximum password age, and automatic rotation after credential
      check-in.

    BeyondTrust PRA: |
      /login > Vault > Account Policies

      /login > Vault > Options > Global Options

  expected_value: |
    Vault Account Policies enforce:
    - Scheduled password rotation
    - A defined maximum password age
    - Automatic credential rotation after credential check-in where supported  

  description: >
    Privileged credentials were not automatically rotated, increasing the risk
    associated with credential disclosure, reuse, and long-term compromise.

  commentary: >
    Automatic credential rotation limits the usefulness of compromised
    credentials and reduces the likelihood of unauthorised access through
    reused, shared, or previously exposed passwords.

  positive: >
    Privileged credentials were rotated automatically using defined Vault
    governance controls.

  solution: >
    Implement automated credential rotation through Vault Account Policies and
    ensure credentials are rotated regularly and following credential check-in
    where appropriate.

  references:

    generic: []

    vendors: 

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/pf-account-policies,
        https://docs.beyondtrust.com/pra/docs/pf-vault-options#scheduled-password-rotation-rules
      ]
    

- finding_id: pra-simultaneous-vault-checkout-allowed
  finding_title: Simultaneous Credential Checkout Permitted
  theme: Administrative Security

  question: |
    Are privileged credentials restricted to a single active checkout?

  expected_answer: compliant

  solution_types:
    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: >
      Determine whether multiple users can check out the same privileged 
      credential simultaneously.

    BeyondTrust PRA: >
      /login > Vault > Account Groups / Account Policies

      /login > Vault > Options > Global Options

  expected_value: |
    Allow Simultaneous Checkout Rules: Deny

  description: >
    Multiple users were permitted to check out the same privileged credential 
    simultaneously.

  commentary: >
    Allowing multiple users to check out the same privileged credential at the 
    same time can reduce accountability and increase the difficulty of 
    attributing privileged activity to specific individuals.

  positive: >
    Privileged credentials were restricted to a single active checkout.

  solution: >
    Configure Vault Account Policies to prevent simultaneous checkout of 
    privileged credentials.

  references:

    generic: []

    vendors:

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/pf-account-groups,
        https://docs.beyondtrust.com/pra/docs/pf-vault-options#allow-simultaneous-checkout-rules
      ]

