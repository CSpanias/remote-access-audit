# Assessment question definitions.
#
# This file contains all audit controls used during VPN reviews.
#
# Each question includes:
# - Vulnerability mapping
# - Compliance expectations
# - Remediation guidance
# - Positive observations
# - Vendor-specific navigation hints
#
# Questions should be maintained within this file rather
# than being hard-coded into the application.
#
# Response Options:
# 1. Compliant
# 2. Non-Compliant
# 3. Not Applicable
# 4. Unknown
#
# Questions should be phrased so that the secure configuration
# state always results in a "Compliant" response.


#-------------------------------------------------------------------------------
# Authentication Controls
#-------------------------------------------------------------------------------

- id: 1
  finding_id: vpn-mfa-not-enforced
  finding_title: VPN Multi-Factor Authentication Not Enforced
  vendors:
    - all
  expected_answer: compliant

  question: Is multi-factor authentication enforced for all VPN users?

  hints:
    common: >
      Review the VPN authentication configuration and confirm
      whether all users are required to complete MFA authentication
      during the VPN sign-in process.

    Microsoft Always On VPN: >
      NPS > Network Policies > Authentication Configuration

    Cisco Secure Client: >
      ASA / Secure Firewall > Remote Access VPN > Connection Profiles

    Palo Alto GlobalProtect: >
      Network > GlobalProtect > Portals/Gateways > Authentication

    Fortinet FortiClient: >
      User & Authentication > User Groups

  description: >
    Multi-factor authentication was not enforced for VPN users,
    increasing the risk of account compromise through credential
    theft, password spraying, brute-force attacks, and credential
    reuse.

  commentary: >
    VPN access relied solely on single-factor authentication.
    As a result, compromise of user credentials may provide an
    attacker with remote access to internal systems and services.
    Multi-factor authentication provides an additional layer of
    protection by requiring a second form of verification beyond
    a password.

  solution: >
    Enforce multi-factor authentication for all VPN users and
    administrators.

  positive: >
    Multi-factor authentication is enforced for all VPN users.

  good_value: >
    MFA is mandatory for all VPN access.

  bad_value: >
    VPN access is protected only by passwords.

- id: 2
  finding_id: vpn-shared-accounts-permitted
  finding_title: Shared VPN Accounts Permitted
  vendors:
    - all
  expected_answer: compliant

  question: Are individual user accounts required for VPN access?

  hints:
    common: >
      Determine whether VPN users authenticate using individually
      assigned accounts. Review authentication sources, user
      accounts, and account assignment processes to confirm shared
      accounts are not used.

  description: >
    Shared VPN accounts were permitted, reducing accountability
    and increasing the difficulty of attributing activity to
    specific users.

  commentary: >
    The use of shared accounts limits auditability and may
    prevent accurate attribution of actions performed through
    VPN connections.

  solution: >
    Require all VPN users to authenticate using unique
    individual accounts.

  positive: >
    All VPN access is performed using uniquely assigned accounts.

  good_value: >
    Individual user accounts are required.

  bad_value: >
    Shared VPN accounts are permitted.

- id: 3
  finding_id: vpn-local-accounts-enabled
  finding_title: Local VPN Accounts Enabled
  vendors:
    - all
  expected_answer: compliant

  question: Is centralised identity management used instead of local VPN 
    accounts?

  hints:
    common: >
      Identify the source used to authenticate VPN users and
      determine whether authentication is integrated with a central
      identity platform such as Entra ID, Active Directory, LDAP,
      or RADIUS rather than locally managed VPN accounts.

  description: >
    VPN authentication relied on locally managed accounts rather
    than an enterprise identity provider.

  commentary: >
    Locally managed authentication increases administrative
    overhead and may reduce visibility, governance, and control
    over account lifecycle management.

  solution: >
    Integrate VPN authentication with a central identity source
    such as Entra ID, Active Directory, LDAP, or RADIUS.

  positive: >
    VPN authentication is integrated with a central identity
    provider.

  good_value: >
    Centralised identity management is in use.

  bad_value: >
    Local VPN accounts are used.

- id: 4
  finding_id: vpn-weak-authentication-methods
  finding_title: Weak Authentication Methods Allowed
  vendors:
    - all
  expected_answer: compliant

  question: Are legacy authentication mechanisms disabled?

  hints:
    common: >
      Review supported authentication methods and verify that legacy
      or insecure authentication mechanisms such as PAP, CHAP,
      MS-CHAPv1, or equivalent deprecated methods are not permitted.

  description: >
    Legacy authentication mechanisms were enabled, increasing
    exposure to credential attacks and authentication bypass.

  commentary: >
    Older authentication methods may not provide sufficient
    protection against modern attack techniques.

  solution: >
    Disable legacy authentication protocols and require modern,
    supported authentication methods.

  positive: >
    Legacy authentication mechanisms have been disabled.

  good_value: >
    Only modern authentication methods are permitted.

  bad_value: >
    Legacy authentication remains enabled.

- id: 5
  finding_id: vpn-admin-mfa-not-enforced
  finding_title: VPN Administrator Multi-Factor Authentication Not Enforced
  vendors:
    - all
  expected_answer: compliant

  question: Is multi-factor authentication enforced for VPN administrators?

  hints:
    common: >
      Review the authentication requirements for administrative
      access to the VPN platform and confirm whether privileged
      users are required to complete multi-factor authentication.

  description: >
    Multi-factor authentication was not enforced for VPN
    administrators, increasing the risk of administrative
    account compromise.

  commentary: >
    Administrative accounts provide highly privileged access to
    the VPN environment. Compromise of such accounts may allow
    an attacker to modify configurations, weaken security
    controls, or establish persistent access.

  solution: >
    Enforce multi-factor authentication for all VPN
    administrative accounts.

  positive: >
    Multi-factor authentication is enforced for VPN
    administrators.

  good_value: >
    Administrative MFA is enforced.

  bad_value: >
    Administrative accounts rely solely on passwords.

#-------------------------------------------------------------------------------
# Protocol & Cryptography Controls
#-------------------------------------------------------------------------------

- id: 6
  finding_id: vpn-insecure-protocol-enabled
  finding_title: Insecure VPN Protocols Enabled
  vendors:
    - all
  expected_answer: compliant

  question: Are legacy VPN protocols such as PPTP disabled?

  hints:
    common: >
      Review the VPN protocols supported by the platform and verify
      that deprecated protocols such as PPTP are disabled and cannot
      be used by clients.

  description: >
    Legacy VPN protocols were permitted despite known security
    weaknesses.

  commentary: >
    Protocols such as PPTP are no longer considered suitable for
    protecting sensitive organisational communications.

  solution: >
    Disable insecure VPN protocols and require modern encrypted
    alternatives.

  positive: >
    Legacy VPN protocols have been disabled.

  good_value: >
    Only modern VPN protocols are permitted.

  bad_value: >
    Legacy VPN protocols remain enabled.

- id: 7
  finding_id: vpn-weak-tls-configuration
  finding_title: Weak TLS Configuration
  vendors:
    - all
  expected_answer: compliant

  question: Are only TLS 1.2 and TLS 1.3 permitted for VPN communications?

  hints:

  hints:
    common: >
      Review TLS configuration and confirm that only supported TLS
      versions are permitted for VPN communications.

    Microsoft Always On VPN: >
      RRAS Server, SCHANNEL TLS Configuration, NPS and Windows Security Settings

  description: >
    Older TLS versions were permitted for VPN connections.

  commentary: >
    Deprecated TLS versions contain known weaknesses and may
    expose VPN communications to downgrade and cryptographic
    attacks.

  solution: >
    Disable TLS 1.0 and TLS 1.1 and require TLS 1.2 or TLS 1.3.

  positive: >
    VPN communications are restricted to supported TLS versions.

  good_value: >
    TLS 1.2 and TLS 1.3 only.

  bad_value: >
    Deprecated TLS versions are permitted.

- id: 8
  finding_id: vpn-weak-cryptography
  finding_title: Weak Cryptographic Algorithms Permitted
  vendors:
    - all
  expected_answer: compliant

  question: Are deprecated ciphers and cryptographic algorithms disabled?

  hints:
    common: >
      Review cryptographic configuration including cipher suites,
      encryption algorithms, integrity algorithms, and key exchange
      settings. Confirm deprecated or weak algorithms are disabled.


  description: >
    Weak or deprecated cryptographic algorithms remained enabled.

  commentary: >
    Deprecated cryptographic algorithms may reduce the
    confidentiality and integrity of VPN communications.

  solution: >
    Disable deprecated cipher suites and follow vendor security
    recommendations for cryptographic configuration.

  positive: >
    Strong, modern cryptographic algorithms are enforced.

  good_value: >
    Deprecated cryptography is disabled.

  bad_value: >
    Weak cryptographic algorithms remain enabled.

#-------------------------------------------------------------------------------
# Access Control Controls
#-------------------------------------------------------------------------------

- id: 9
  finding_id: vpn-excessive-network-access
  finding_title: Excessive VPN Network Access
  vendors:
    - all
  expected_answer: compliant

  question: Is VPN access restricted based on user or device role?

  hints:
    common: >
      Determine whether users and devices receive access based on
      business requirements. Review security groups, access
      policies, network segmentation controls, firewall rules, and
      access restrictions where applicable.

    Microsoft Always On VPN: >
      RRAS Policies, NPS Policies, Firewall Rules,
      Security Groups, and Network Segmentation Controls.

  description: >
    VPN users were granted unnecessary access to internal
    resources.

  commentary: >
    Excessive network access increases the potential impact of
    account compromise and insider misuse.

  solution: >
    Restrict VPN access according to business requirements and
    least-privilege principles.

  positive: >
    VPN access is restricted according to business requirements.

  good_value: >
    Least-privilege access is enforced.

  bad_value: >
    Excessive network access is permitted.

- id: 10
  finding_id: vpn-unrestricted-split-tunnelling
  finding_title: Unrestricted Split Tunnelling
  vendors:
    - all
  expected_answer: compliant

  question: Is split tunnelling disabled or appropriately restricted?

  hints:
    common: >
      Review VPN routing behaviour and determine whether split
      tunnelling is disabled or governed through documented
      restrictions, approved routes, and security controls.

  description: >
    Split tunnelling was enabled without appropriate controls.

  commentary: >
    Split tunnelling may expose managed devices to untrusted
    networks while simultaneously connected to internal
    resources.

  solution: >
    Disable split tunnelling where possible or implement
    documented restrictions and monitoring controls.

  positive: >
    Split tunnelling is disabled or appropriately controlled.

  good_value: >
    Split tunnelling is controlled.

  bad_value: >
    Split tunnelling is unrestricted.

- id: 11
  finding_id: vpn-device-compliance-not-enforced
  finding_title: Device Compliance Validation Not Enforced
  vendors:
    - all
  expected_answer: compliant

  question: Are device compliance or health checks performed before granting 
    VPN access?

  hints:
    common: >
      Determine whether devices are evaluated against security
      requirements before VPN access is granted. Examples include
      compliance policies, health checks, certificates, patch
      validation, or endpoint security requirements.

    Microsoft Always On VPN: >
      Device certificates, Intune compliance policies, or computer-group 
      restrictions.

  description: >
    VPN access was granted without validating device security
    posture.

  commentary: >
    Devices that fail basic security requirements may retain
    access to organisational systems and services.

  solution: >
    Require device compliance checks before VPN access is
    granted.

  positive: >
    Device compliance validation is enforced prior to access.

  good_value: >
    Device health is validated.

  bad_value: >
    Unvalidated devices can connect.

- id: 12
  finding_id: vpn-unmanaged-devices-allowed
  finding_title: Unmanaged Devices Permitted
  vendors:
    - all
  expected_answer: compliant

  question: Is VPN access restricted to managed or approved devices?

  hints:
    common: >
      Determine whether VPN access is restricted to approved or
      organisationally managed devices. Review device enrollment,
      device certificates, management platforms, or access policies
      enforcing device trust requirements.

  description: >
    Unmanaged devices were permitted to establish VPN
    connections.

  commentary: >
    Unmanaged devices may not meet organisational security
    requirements and may increase security risk.

  solution: >
    Restrict VPN access to managed and approved devices.

  positive: >
    Only managed devices are permitted to access the VPN.

  good_value: >
    Managed devices only.

  bad_value: >
    Unmanaged devices are permitted.

- id: 13
  finding_id: vpn-user-access-not-reviewed
  finding_title: VPN User Access Not Periodically Reviewed
  vendors:
    - all
  expected_answer: compliant

  question: Is VPN user access reviewed on a regular basis?

  hints:
    common: >
      Ask how VPN access is reviewed, who performs the review, how
      often it occurs, and whether evidence of recent reviews can
      be provided. Examples include access review records,
      approval workflows, tickets, or entitlement reviews.

    Microsoft Always On VPN: >
      Active Directory or Entra ID VPN access groups,
      access review records, and entitlement reviews.

  description: >
    VPN user access was not subject to periodic review.

  commentary: >
    Access reviews help ensure that users retain only the access
    required for their current job responsibilities. Regular
    reviews reduce the risk of excessive access, orphaned
    accounts, and inappropriate access permissions remaining
    assigned following role changes.

  solution: >
    Perform periodic access reviews and remove unnecessary VPN
    access.

  positive: >
    VPN user access is reviewed regularly.

  good_value: >
    Access reviews are performed.

  bad_value: >
    User access is not reviewed.

#-------------------------------------------------------------------------------
# Session & Monitoring Controls
#-------------------------------------------------------------------------------

- id: 14
  finding_id: vpn-insufficient-logging
  finding_title: Insufficient VPN Logging and Monitoring
  vendors:
    - all
  expected_answer: compliant

  question: Are VPN authentication and connection events logged and monitored?

  hints:
    common: >
      Review whether VPN authentication attempts, connection events,
      and security-relevant activity are logged and monitored.
      Determine whether logs are regularly reviewed or integrated
      with a central monitoring platform.

    Microsoft Always On VPN: >
      Event Viewer > Microsoft > Windows > RemoteAccess,
      RRAS Logs, NPS Logs, and SIEM Integration.

  description: >
    VPN activity was not adequately logged or monitored.

  commentary: >
    Insufficient logging reduces visibility of suspicious activity, 
    authentication abuse, and security incidents.

  solution: >
    Enable logging of authentication, connection, and administrative events and 
    integrate logs with monitoring processes.

  positive: >
    VPN activity is logged and monitored.

  good_value: >
    Logging and monitoring are implemented.

  bad_value: >
    VPN activity is not adequately monitored.

- id: 15
  finding_id: vpn-admin-activity-not-logged
  finding_title: Administrative Actions Not Logged
  vendors:
    - all
  expected_answer: compliant

  question: Are administrative actions logged and retained?

  hints:
    common: >
      Review whether administrative actions and configuration
      changes are recorded in audit logs and retained for
      investigation and accountability purposes.

    Microsoft Always On VPN: >
      Event Viewer, Local Security Logs, RRAS Administrative Logs, and SIEM 
      Integration.

  description: >
    Administrative activity was not adequately logged or retained.

  commentary: >
    A lack of administrative logging reduces accountability and hinders the 
    investigation of configuration changes, security incidents, and misuse of 
    privileged accounts.

  solution: >
    Enable logging and retention of administrative actions and regularly review 
    logged events.

  positive: >
    Administrative actions are logged and retained appropriately.

  good_value: >
    Administrative activity is logged.

  bad_value: >
    Administrative activity is not logged.

#-------------------------------------------------------------------------------
# Administrative Security Controls
#-------------------------------------------------------------------------------

- id: 16
  finding_id: vpn-excessive-admin-privileges
  finding_title: Excessive Administrative Privileges
  vendors:
    - all
  expected_answer: compliant

  question: Is role-based access control used for VPN administration?

  hints:
    common: >
      Review administrative accounts, roles, and permissions.
      Determine whether administrators receive only the privileges
      required for their responsibilities and whether permissions
      are assigned using defined roles.

    Microsoft Always On VPN: >
      Local Administrators Group, Server Administration Roles, Entra Roles, 
      and Delegated Permissions.

  description: >
    Administrative access to the VPN platform was not restricted according to 
    role-based access control principles.

  commentary: >
    Granting unnecessary administrative privileges increases the risk of 
    accidental misconfiguration, malicious abuse, and unauthorised changes to 
    security controls.

  solution: >
    Implement role-based access control and ensure administrative permissions 
    are limited to the minimum required for each role.

  positive: >
    Administrative access is controlled through role-based access control and 
    least-privilege principles.

  good_value: >
    Administrative privileges are role-based.

  bad_value: >
    Excessive administrative privileges are assigned.

#-------------------------------------------------------------------------------
# Microsoft AOVPN Specific
#-------------------------------------------------------------------------------

- id: 17
  finding_id: aovpn-device-authentication-not-enforced
  finding_title: Device Authentication Not Enforced
  expected_answer: compliant

  vendors:
    - Microsoft Always On VPN

  question: Is machine certificate authentication required for Device Tunnel 
    connections?

  hints:
    common: >
      Determine how Device Tunnel connections authenticate to the
      VPN service. Confirm device identity is validated using
      machine certificates rather than user credentials and verify
      only trusted, managed devices can establish Device Tunnel
      connections.

    Microsoft Always On VPN: >
      NPS > Network Policies > Constraints >
      Authentication Methods, and RRAS > Security >
      Authentication Provider. Confirm Device Tunnel
      connections require machine certificate authentication.

  description: >
    Device Tunnel connections were not restricted to machine certificate 
    authentication.

  commentary: >
    Device Tunnel connectivity should rely on device identity rather than user 
    credentials. Failure to enforce device authentication may reduce assurance 
    that connecting systems are trusted and managed.

  solution: >
    Configure Device Tunnel connections to use machine certificate 
    authentication only.

  positive: >
    Device Tunnel connectivity requires machine certificates.

  good_value: >
    Machine certificate authentication is enforced.

  bad_value: >
    Device authentication is not enforced.

- id: 18
  finding_id: aovpn-prelogon-connectivity-disabled
  finding_title: Pre-Logon VPN Connectivity Not Available
  expected_answer: compliant

  vendors:
    - Microsoft Always On VPN

  question: Is Always On VPN connectivity enforced without requiring user 
    intervention?

  hints:
    common: >
      Determine whether VPN connectivity is established
      automatically without requiring users to manually launch
      or connect the VPN. Confirm connectivity is available
      whenever the device is outside trusted networks.

    Microsoft Always On VPN: >
      VPN Profile XML. Confirm AlwaysOn=true and
      Device Tunnel configuration where applicable.

  description: >
    VPN connectivity was not available before user authentication.

  commentary: >
    Pre-logon VPN connectivity supports device management, Group Policy 
    processing, certificate enrollment, and other infrastructure services 
    before user sign-in. Environments relying on device tunnels may require 
    this capability.

  solution: >
    Configure Device Tunnel connectivity to establish VPN access before user 
    authentication where operationally required.

  positive: >
    VPN connectivity is available prior to user logon.

  good_value: >
    Pre-logon VPN connectivity is available.

  bad_value: >
    VPN connectivity requires user sign-in.

- id: 19
  finding_id: aovpn-route-validation-not-enforced
  finding_title: Route Validation Controls Not Enforced
  expected_answer: compliant

  vendors:
    - Microsoft Always On VPN

  question: Are VPN routes restricted to approved destinations and networks?

  hints:
    common: >
      Review which networks and resources are accessible
      through the VPN. Confirm only approved routes and
      destinations are available and that unnecessary
      internal networks are not exposed to remote devices.

    Microsoft Always On VPN: >
      VPN Profile XML > Routes, RRAS configuration,
      route validation controls and exclusions.


  description: >
    Route restrictions and validation controls were not enforced for VPN 
    traffic.

  commentary: >
    Route validation helps ensure traffic is routed only through approved 
    network paths and reduces the risk of traffic bypassing organisational 
    security controls.

  solution: >
    Implement route validation controls and restrict VPN traffic to approved 
    routes and destinations.

  positive: >
    Route validation controls are implemented and enforced.

  good_value: >
    Route validation is enforced.

  bad_value: >
    VPN routes are not validated.

- id: 20
  finding_id: aovpn-split-tunnel-not-controlled
  finding_title: Split Tunnel Configuration Not Adequately Controlled
  expected_answer: compliant

  vendors:
    - Microsoft Always On VPN

  question: Are split tunnel exclusions documented and approved?

  hints:
    common: >
      Determine whether split tunnel exclusions have been
      formally reviewed, approved, and documented. Assess
      whether excluded destinations are supported by a
      legitimate business requirement and align with the
      organisation's remote access security model.

    Microsoft Always On VPN: >
      VPN Profile XML > RoutingPolicyType,
      Traffic Filters, Exclusion Routes,
      and Split Tunnel configuration.
      Review supporting documentation or change
      records evidencing approval of exclusions.

  description: >
    Split tunnel behaviour was not adequately documented, governed or 
    restricted.

  commentary: >
    Poorly controlled split tunnel configurations may allow traffic to bypass 
    organisational monitoring and security controls, potentially increasing 
    security risk.

  solution: >
    Document and review split tunnel requirements and restrict exclusions to 
    approved business use cases.

  positive: >
    Split tunnel behaviour is documented and appropriately controlled.

  good_value: >
    Split tunnel configuration is governed and restricted.

  bad_value: >
    Split tunnel behaviour is uncontrolled.

