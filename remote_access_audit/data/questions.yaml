- finding_id: pra-approval-workflow-not-required
  finding_title: Remote Access Approval Workflow Not Enforced
  theme: Access Control

  question: Is approval required before privileged remote access is granted?

  expected_answer: compliant

  solution_types:
    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: >
      Determine whether privileged remote access requests are
      subject to an approval process before access is granted.

  description: >
    Privileged remote access was granted without requiring
    appropriate approval.

  commentary: >
    Access approval workflows help ensure privileged access is
