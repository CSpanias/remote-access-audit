- finding_id: pra-session-inactivity-timeout-not-configured
  finding_title: Session Inactivity Timeout Not Configured
  theme: Monitoring and Detection

  question: |
    Are inactive users automatically logged out of the access console and 
    removed from privileged sessions?

  expected_answer: compliant

  solution_types:
    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: |
      Idle users are automatically logged out of the Access Console and removed 
      from active sessions after a defined period of inactivity.

    BeyondTrust PRA: |
      Users & Security > Group Policies > Access Permissions
      Management > Security > Access Console (Global?)

  expected_value: |
    Review:
    - Log Out Idle User After: Not "Never"
    - Remove User From Session After Inactivity: Not "No Timeout"

  description: >
    Privileged sessions were permitted to remain active indefinitely during 
    periods of user inactivity.

  commentary: >
    Inactive privileged sessions increase the risk of unauthorised access 
    through unattended workstations, abandoned sessions, or misuse of 
    authenticated session context. Session timeout controls help ensure 
    privileged access remains limited to active users.

  positive: >
    Inactive privileged sessions were automatically terminated after a defined 
    period of inactivity.

  solution: >
    Configure inactivity timeout controls to automatically remove users from 
    privileged sessions after an appropriate period of inactivity.

  references:

    generic: []

    vendors:

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/pf-group-policies,
        https://docs.beyondtrust.com/pra/docs/pf-security#log-out-idle-user-after,
        https://docs.beyondtrust.com/pra/docs/pf-security#remove-user-from-session-after-inactivity
      ]

