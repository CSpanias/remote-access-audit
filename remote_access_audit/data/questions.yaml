  solution: >
    Restrict Jump Client deployment to approved systems and
    review deployments periodically.

  positive: >
    Jump Client deployment was appropriately controlled.

- finding_id: pra-gateway-access-not-restricted
  finding_title: Gateway Access Not Adequately Restricted
  theme: Access Control

  question: Are PRA Gateway access permissions restricted through Asset Groups,
    user assignments, and protocol controls?

  expected_answer: compliant

  expected_value: >
    PRA Gateways are deployed only where required, restricted
    to approved users and systems, and configured to permit
    only authorised protocols and access paths.

  solution_types:
    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: >
      Review how PRA Gateways are deployed and determine
      whether access through Gateways is restricted according
      to business requirements and least-privilege principles.

    BeyondTrust PRA: >
      /login > Asset Management > Gateways.

      Review Gateway placement, authorised users,
      accessible Asset Groups, supported protocols,
      and associated access restrictions.

  description: >
    PRA Gateways were not adequately restricted, providing
    broader access to systems, networks, or services than
    required.

  commentary: >
    Gateways can provide access to large numbers of systems
    within managed environments. Excessive Gateway access may
    increase the impact of account compromise or privileged
    misuse and may expose systems that do not require remote
    access. Gateway deployments should be aligned to business
    requirements and restricted according to least-privilege
    principles.

  solution: >
    Review Gateway deployments and restrict access to
    authorised users, systems, Asset Groups, and protocols.
    Remove unnecessary Gateway connectivity and implement
    periodic reviews of Gateway access.

  positive: >
    Gateway access was appropriately restricted and aligned
    to operational requirements.

- finding_id: pra-credential-injection-not-used
