- finding_id: pra-session-recording-can-be-disabled
  finding_title: Session Recording Can Be Disabled Through Asset Policies
  theme: Monitoring and Detection

  question: | 
    Can Asset Policies override and disable privileged session recording?

  expected_answer: compliant

  solution_types:
    - pra

  vendors:
    - BeyondTrust PRA

  hints:
    common: |
      Review configured Asset Policies and confirm the "Disable Recordings" 
      option is not enabled for privileged Assets.

    BeyondTrust PRA: |
      Asset Management > Asset Policies > Disable Recordings

  expected_value: >
    Disabled Recordings: Not checked

  description: >
    Asset Policies permitted privileged sessions to bypass session recording 
    controls.

  commentary: >
    Session recording is an important detective and forensic control for 
    privileged access activities. Allowing Asset Policies to disable recording 
    may reduce accountability and limit the organisation's ability to 
    investigate privileged activity, unauthorised actions, or security 
    incidents affecting critical systems.

  positive: >
    Session recording controls could not be bypassed through Asset Policy 
    configuration.

  solution: >
    Ensure privileged Asset Policies do not disable session recording 
    functionality and review policy exceptions regularly.

  references:

    generic: []

    vendors:

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/pf-jump-policies#disable-recordings,
      ]