- finding_id: insufficient-logging
  finding_title: Insufficient Remote Access Logging and Monitoring
  theme: Monitoring and Detection

  question: Are remote access authentication, connection, and session events
    logged and retained appropriately?

  expected_answer: compliant

  expected_value: |
    Authentication events, connection activity, and session activity are logged 
    and retained for an appropriate period to support audit, investigation, and 
    reporting requirements.

  solution_types:
    - vpn
    - pra

  vendors:
    - all

  hints:
    common: |
      Review whether authentication attempts, connection events,
      administrative actions, and other security-relevant remote
      access activity are logged and monitored. Determine whether
      logs are regularly reviewed or integrated with a central
      monitoring platform.

    Microsoft Always On VPN: |
      Event Viewer > Microsoft > Windows > RemoteAccess, RRAS Logs, NPS Logs, 
      and SIEM Integration.

    BeyondTrust PRA: |
      /login > Reports > Access
      /login > Reports > Vault
      /login > Reports > Vendors

      Review session activity, Vault activity, privileged credential usage, 
      vendor events, authentication events, and security-relevant 
      administrative actions.

  description: >
    Remote access activity was not adequately logged or retained.

  commentary: >
    Insufficient logging reduces visibility of suspicious activity, 
    authentication abuse, and security incidents.

  positive: >
    Remote access authentication, connection, and session activity was logged 
    and retained appropriately.

  solution: >
    Ensure that authentication, connection, and session activity is logged and 
    retained for an appropriate period in accordance with organisational 
    monitoring and audit requirements.

  references:

    generic: []

    vendors: 

      Microsoft Always On VPN: [
        https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/,
      ]

      BeyondTrust PRA: [
        https://docs.beyondtrust.com/pra/docs/pf-reports,
      ]

