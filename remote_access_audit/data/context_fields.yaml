# Context fields collected before an assessment begins.
#
# These fields define the information required to describe
# the client's remote access environment, including the
# access solution, authentication mechanisms, identity
# services, and deployment characteristics.
#
# Fields are loaded dynamically by the application to allow
# future expansion without code changes.

- id: client_name
  label: What is the organisation's name?
  type: string
  required: true

  phase: setup

  solution_types:
    - vpn
    - pra

- id: remote_access_solution
  label: Which remote access solution is being reviewed?
  type: choice
  required: true

  phase: setup

  solution_types:
    - vpn
    - pra

  options:
    - Microsoft Always On VPN
    - BeyondTrust PRA
    - Other

- id: deployment_type
  label: How is the PRA solution deployed?
  type: choice
  required: true

  phase: context

  solution_types:
    - pra

  options:
    - BeyondTrust Cloud
    - Hybrid
    - On-Premises Physical Appliance
    - On-Premises Virtual Appliance
    - Other

  context_description: >
    The deployment model helps determine responsibility for appliance 
    management, platform maintenance, security updates, backup and disaster 
    recovery arrangements, and supporting infrastructure components.

  option_descriptions:

    BeyondTrust Cloud: >
      BeyondTrust manages the underlying platform infrastructure and applies 
      critical platform updates. Connectivity is typically limited to TCP 443.

    Hybrid: >
      The PRA appliance is cloud-hosted or externally managed, but supporting 
      components such as identity providers, Gateways, Jump Clients, managed 
      assets, or supporting infrastructure are hosted within the organisation's
      environment.

    On-Premises Virtual Appliance: >
      The organisation is responsible for appliance updates, backups, 
      networking, disaster recovery, and infrastructure security. The platform 
      is hosted on customer-managed virtualisation infrastructure.

    On-Premises Physical Appliance: >
      The organisation is responsible for appliance updates, backups, 
      networking, disaster recovery, and infrastructure security. The platform 
      is hosted on dedicated B Series appliance hardware.

- id: vpn_authentication_method
  label: What is the primary VPN authentication method?
  type: choice
  required: true

  phase: context

  solution_types:
    - vpn

  options:
    - Machine Certificate
    - User Certificate
    - EAP-TLS
    - PEAP
    - Username and Password
    - Username and Password with MFA
    - Other

- id: identity_provider
  label: What is the primary identity provider / authentication source?
  type: choice
  required: true

  phase: context

  solution_types:
    - vpn
    - pra

  options:
    - Microsoft Entra ID
    - Active Directory
    - LDAP Directory
    - Local Accounts
    - Other

  context_description: >
    The identity provider determines how users authenticate to the remote 
    access solution and influences the availability of security controls such 
    as multi-factor authentication, conditional access, user lifecycle
    management, identity governance, and access reviews.

  option_descriptions:

    Microsoft Entra ID: >
      Users authenticate through Microsoft Entra ID, enabling centralised 
      identity management and integration with controls such as multi-factor 
      authentication, Conditional Access, identity governance, and access 
      reviews.

    Active Directory: >
      Users authenticate through on-premises Active Directory. Authentication 
      and access management are controlled through domain-based identities, 
      groups, and policies.

    LDAP Directory: >
      Users authenticate through a central LDAP-based directory service. User 
      identities, groups, and authentication policies are managed within the 
      directory platform.

    Local Accounts: >
      Authentication relies on accounts managed directly within the remote 
      access platform rather than a central identity provider.

    Other: >
      Authentication is performed using an alternative identity source not 
      captured by the predefined options.

- id: tunnel_type
  label: Which VPN tunnel type is deployed?
  type: choice
  required: true

  phase: context

  solution_types:
    - vpn

  options:
    - Device Tunnel
    - User Tunnel
    - Device and User Tunnel

- id: certificate_authority
  label: Which Certificate Authority is used for VPN authentication?
  type: choice
  required: true

  phase: context

  solution_types:
    - vpn

  options:
    - Active Directory Certificate Services (AD CS)
    - Intune PKCS
    - Intune SCEP
    - Third-Party CA
    - Other

- id: split_tunnel_mode
  label: How is VPN traffic routed?
  type: choice
  required: true

  phase: context

  solution_types:
    - vpn

  options:
    - Full Tunnel
    - Split Tunnel
    - Split-by-Exception

- id: product_version
  label: What version of BeyondTrust PRA is deployed?
  type: string
  required: true

  phase: context

  solution_types:
    - pra

  context_description: >
    The product version provides useful assessment context and may assist with 
    validating feature availability, release lifecycle status, and vendor 
    guidance during the review.

  hints:
    BeyondTrust PRA: |
      /appliance > Status > Information > Site Status > Product Version