# Context fields collected before an assessment begins.
#
# These fields define the information required to describe
# the client's remote access environment, including the
# access solution, authentication mechanisms, identity
# services, and deployment characteristics.
#
# Fields are loaded dynamically by the application to allow
# future expansion without code changes.

- id: client_name
  label: What is the organisation's name?
  type: string
  required: true

  phase: setup

  solution_types:
    - vpn
    - pra

- id: remote_access_solution
  label: Which remote access solution is being reviewed?
  type: choice
  required: true

  phase: setup

  solution_types:
    - vpn
    - pra

  options:
    - Microsoft Always On VPN
    - BeyondTrust PRA
    - Other

- id: deployment_type
  label: How is the PRA solution is deployed?
  type: choice
  required: true

  phase: context

  solution_types:
    - pra

  options:
    - BeyondTrust Cloud
    - On-Premises Physical Appliance
    - On-Premises Virtual Appliance
    - Other

  context_description: >
    The PRA deployment model determines responsibility for
    platform maintenance, security updates, backup, disaster
    recovery, networking, and infrastructure management.

  option_descriptions:

    BeyondTrust Cloud: >
      BeyondTrust manages the underlying platform infrastructure and
      applies critical platform updates. Connectivity is typically
      limited to TCP 443.

    On-Premises Virtual Appliance: >
      The organisation is responsible for appliance updates,
      backups, networking, disaster recovery, and infrastructure
      security. The platform is hosted on customer-managed
      virtualisation infrastructure.

    On-Premises Physical Appliance: >
      The organisation is responsible for appliance updates,
      backups, networking, disaster recovery, and infrastructure
      security. The platform is hosted on dedicated B Series
      appliance hardware.

- id: vpn_authentication_method
  label: What is the primary VPN authentication method?
  type: choice
  required: true

  phase: context

  solution_types:
    - vpn

  options:
    - Machine Certificate
    - User Certificate
    - EAP-TLS
    - PEAP
    - Username and Password
    - Username and Password with MFA
    - Other

- id: identity_provider
  label: What is the primary identity provider / authentication source?
  type: choice
  required: true

  phase: context

  solution_types:
    - vpn
    - pra

  options:
    - Microsoft Entra ID
    - Active Directory
    - LDAP
    - Kerberos
    - OpenID Connect
    - SAML
    - RADIUS (VPN-only)
    - Local Accounts
    - Other

  context_description: >
    The identity provider determines how users authenticate
    to the remote access solution and influences the
    availability of security controls such as multi-factor
    authentication, conditional access, user lifecycle
    management, identity governance, and access reviews.

  option_descriptions:

    Microsoft Entra ID: >
      Users authenticate through Microsoft Entra ID, enabling
      centralised identity management and integration with
      security controls such as Conditional Access, MFA,
      identity protection, and access reviews.

    Active Directory: >
      Users authenticate through on-premises Active Directory.
      Authentication and access management are controlled
      through domain-based identities, groups, and policies.

    LDAP: >
      Users authenticate through an LDAP directory service.
      User identities, groups, and authentication policies
      are managed centrally within the directory platform.

    Kerberos: >
      Authentication is performed using the Kerberos protocol,
      typically within an Active Directory environment,
      providing integrated and ticket-based authentication.

    OpenID Connect: >
      Authentication is federated through an OpenID Connect
      identity provider, enabling modern web-based
      authentication and single sign-on capabilities.

    SAML: >
      Authentication is federated through a SAML identity
      provider, enabling single sign-on and centralised
      identity management across multiple services.

    RADIUS (VPN-only): >
      Authentication requests are processed through a RADIUS
      server, commonly used by VPN solutions to integrate
      with enterprise authentication services and MFA
      platforms.

    Local Accounts: >
      Authentication relies on accounts managed directly
      within the remote access platform rather than a central
      identity provider. This may reduce visibility,
      governance, and lifecycle management capabilities.

    Other: >
      Authentication is performed using an alternative
      identity source not captured by the predefined options.

- id: tunnel_type
  label: Which VPN tunnel type is deployed?
  type: choice
  required: true

  phase: context

  solution_types:
    - vpn

  options:
    - Device Tunnel
    - User Tunnel
    - Device and User Tunnel

- id: certificate_authority
  label: Which Certificate Authority is used for VPN authentication?
  type: choice
  required: true

  phase: context

  solution_types:
    - vpn

  options:
    - Active Directory Certificate Services (AD CS)
    - Intune PKCS
    - Intune SCEP
    - Third-Party CA
    - Other

- id: split_tunnel_mode
  label: How is VPN traffic routed?
  type: choice
  required: true

  phase: context

  solution_types:
    - vpn

  options:
    - Full Tunnel
    - Split Tunnel
    - Split-by-Exception