# Context fields collected before an assessment begins.
#
# These fields define the information required to describe
# the client's remote access environment, including the
# access solution, authentication mechanisms, identity
# services, and deployment characteristics.
#
# Fields are loaded dynamically by the application to allow
# future expansion without code changes.

- id: client_name
  order: 1
  label: What is the organisation's name?
  type: string
  required: true

  solution_types:
    - vpn
    - pra

- id: remote_access_solution
  order: 2
  label: Which remote access solution is being reviewed?
  type: choice
  required: true

  solution_types:
    - vpn
    - pra

  options:
    - Microsoft Always On VPN
    - BeyondTrust PRA
    - Other

- id: platform_version
  order: 3
  label: Which platform version / service release is in use?
  type: string
  required: true

  solution_types:
    - vpn
    - pra

- id: authentication_method
  order: 4
  label: What is the primary authentication method?
  type: choice
  required: true

  solution_types:
    - vpn
    - pra

  options:
    - Machine Certificate
    - User Certificate
    - EAP-TLS
    - Username and Password
    - Username and Password with MFA
    - SAML / SSO
    - Other

- id: identity_provider
  order: 5
  label: What is the identity provider / authentication source?
  type: choice
  required: true

  solution_types:
    - vpn
    - pra

  options:
    - Microsoft Entra ID
    - Active Directory
    - LDAP
    - RADIUS
    - Local Accounts
    - Other

- id: tunnel_type
  order: 6
  label: Which VPN tunnel type is deployed?
  type: choice
  required: true

  solution_types:
    - vpn

  options:
    - Device Tunnel
    - User Tunnel
    - Device and User Tunnel

- id: certificate_authority
  order: 7
  label: Which Certificate Authority is used for VPN authentication?
  type: choice
  required: true

  solution_types:
    - vpn

  options:
    - Active Directory Certificate Services (AD CS)
    - Intune PKCS
    - Intune SCEP
    - Third-Party CA
    - Other

- id: user_control
  order: 8
  label: What level of user control is permitted?
  type: choice
  required: true

  solution_types:
    - vpn
    - pra

  options:
    - No User Control
    - Disconnect Only
    - Full Control

- id: split_tunnel_mode
  order: 9
  label: How is VPN traffic routed?
  type: choice
  required: true

  solution_types:
    - vpn

  options:
    - Full Tunnel
    - Split Tunnel
    - Split-by-Exception

- id: mfa_solution
  order: 10
  label: Who is the Multi-Factor Authentication provider?
  type: choice
  required: true

  solution_types:
    - vpn
    - pra

  options:
    - Microsoft Entra MFA
    - Microsoft Authenticator
    - Duo Security
    - RSA SecureID
    - Okta Verify
    - PingID
    - Cisco Duo
    - BeyondTrust Verify
    - Other
    - Not Applicable