# Context fields collected before an assessment begins.
#
# These fields define the information required to describe
# the client's remote access environment, including the
# access solution, authentication mechanisms, identity
# services, and deployment characteristics.
#
# Fields are loaded dynamically by the application to allow
# future expansion without code changes.

- id: client_name
  label: What is the organisation's name?
  type: string
  required: true

  solution_types:
    - vpn
    - pra

- id: remote_access_solution
  label: Which remote access solution is being reviewed?
  type: choice
  required: true

  solution_types:
    - vpn
    - pra

  options:
    - Microsoft Always On VPN
    - BeyondTrust PRA
    - Other

- id: deployment_type
  label: How is the PRA solution is deployed?
  type: choice
  required: true

  solution_types:
    - pra

  options:
    - Cloud Hosted
    - Virtual Appliance
    - Physical Appliance
    - Other

- id: vpn_authentication_method
  label: What is the primary VPN authentication method?
  type: choice
  required: true

  solution_types:
    - vpn

  options:
    - Machine Certificate
    - User Certificate
    - EAP-TLS
    - PEAP
    - Username and Password
    - Username and Password with MFA
    - Other

- id: identity_provider
  label: What is the primary identity provider / authentication source?
  type: choice
  required: true

  solution_types:
    - vpn
    - pra

  options:
    - Microsoft Entra ID
    - Active Directory
    - LDAP
    - RADIUS
    - Local Accounts
    - SAML / SSO
    - Other

- id: tunnel_type
  label: Which VPN tunnel type is deployed?
  type: choice
  required: true

  solution_types:
    - vpn

  options:
    - Device Tunnel
    - User Tunnel
    - Device and User Tunnel

- id: certificate_authority
  label: Which Certificate Authority is used for VPN authentication?
  type: choice
  required: true

  solution_types:
    - vpn

  options:
    - Active Directory Certificate Services (AD CS)
    - Intune PKCS
    - Intune SCEP
    - Third-Party CA
    - Other

- id: split_tunnel_mode
  label: How is VPN traffic routed?
  type: choice
  required: true

  solution_types:
    - vpn

  options:
    - Full Tunnel
    - Split Tunnel
    - Split-by-Exception