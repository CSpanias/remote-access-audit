[project]
name = "remote-access-audit"
version = "0.0.1"
description = "Interactive remote access configuration review and reporting tool"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Charalampos Spanias" }
]

dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0"
]

keywords = [
    "vpn",
    "always-on-vpn",
    "aovpn",
    "remote-access",
    "remote-access-audit",
    "security-audit",
    "security-assessment",
    "compliance",
    "authentication",
    "mfa",
    "cryptography",
    "access-control",
    "network-security",
    "logging",
    "monitoring",
    "privileged-access",
    "rras",
    "nps",
    "entra-id",
    "active-directory"
]

[project.scripts]
remote-access-audit = "remote_access_audit.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
remote_access_audit = ["data/*.yaml"]